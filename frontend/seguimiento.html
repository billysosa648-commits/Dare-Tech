<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta el estado de reparación de tu equipo Dare-Tech con el número de ticket.">
    <meta name="theme-color" content="#0a0e14">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http://localhost:4000 http://127.0.0.1:4000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Seguimiento de Orden - Dare-Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body class="tracking-page">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <main id="main-content" class="tracking-page__main">
    <h1 class="tracking-page__title">
      [ SEGUIMIENTO DE ORDEN ]
    </h1>
    <p class="tracking-page__back"><a href="index.html" class="back-link"> volver al inicio</a></p>

    <!-- Formulario de búsqueda -->
    <form id="tracking-form" class="tracking-search" novalidate>
      <label for="ticket-input" class="tracking-search__label">Número de ticket</label>
      <div class="tracking-search__controls">
        <input
          id="ticket-input"
          type="text"
          placeholder="Ej: DT-1234567890"
          maxlength="13"
          autocomplete="off"
          class="tracking-search__input"
        >
        <button
          id="search-btn"
          type="submit"
          class="button button--neon tracking-search__submit"
        >
          [ BUSCAR ]
        </button>
      </div>
      <p id="error-message" class="tracking-search__error is-hidden" role="alert"></p>
    </form>

    <!-- Resultado (oculto hasta que haya una búsqueda exitosa) -->
    <section id="result-container" class="tracking-result is-hidden" aria-live="polite" aria-atomic="true" tabindex="-1">

      <header class="tracking-result__heading">
        <div>
          <p class="tracking-result__label">TICKET</p>
          <p id="result-ticket" class="tracking-result__ticket"></p>
        </div>
        <span id="result-status-badge" class="tracking-status-badge"></span>
      </header>

      <div class="tracking-result__details">
        <div>
          <p class="tracking-result__label">Equipo</p>
          <p id="result-device" class="tracking-result__value"></p>
        </div>
        <div>
          <p class="tracking-result__label">Falla reportada</p>
          <p id="result-issue" class="tracking-result__value"></p>
        </div>
      </div>

      <!-- Línea de tiempo -->
      <section class="tracking-history" aria-labelledby="tracking-history-title">
        <h2 id="tracking-history-title" class="tracking-result__label tracking-result__label--spaced">HISTORIAL</h2>
        <ul id="result-history" class="tracking-history__list"></ul>
      </section>

      <!-- Factura -->
      <section id="invoice-section" class="tracking-invoice" aria-labelledby="tracking-invoice-title">
        <h2 id="tracking-invoice-title" class="tracking-result__label tracking-result__label--spaced">FACTURA</h2>
        <div id="invoice-content" class="tracking-invoice__content"></div>
      </section>

    </section>
  </main>

    <script src="js/common.js" defer></script>
    <script src="js/seguimiento.js" defer></script>
</body>
</html>
