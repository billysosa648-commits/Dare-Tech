<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Orden - Dare-Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="stylesheet.css">
</head>
<body class="bg-[#0a0e14] text-slate-300 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-2xl">
    <h1 class="text-2xl md:text-3xl font-bold text-[#00f3ff] glow-cyan mb-6 text-center">
      [ SEGUIMIENTO DE ORDEN ]
    </h1>

    <!-- Formulario de búsqueda -->
    <div class="bg-[#0d1117] border border-[#00f3ff]/20 rounded p-6 mb-6">
      <label class="block text-sm text-slate-400 mb-2">Número de ticket</label>
      <div class="flex gap-2">
        <input
          id="ticket-input"
          type="text"
          placeholder="Ej: DT-00001"
          class="flex-1 bg-[#05080c] border border-[#00f3ff]/40 rounded px-4 py-2 text-slate-200 focus:outline-none focus:border-[#00f3ff]"
        >
        <button
          id="search-btn"
          class="px-6 py-2 border border-[#00f3ff]/40 bg-[#05080c] text-[#00f3ff] rounded hover:bg-[#00f3ff]/15 hover:border-[#00f3ff] transition-all"
        >
          [ BUSCAR ]
        </button>
      </div>
      <p id="error-message" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>

    <!-- Resultado (oculto hasta que haya una búsqueda exitosa) -->
    <div id="result-container" class="bg-[#0d1117] border border-[#00f3ff]/20 rounded p-6 hidden">

      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-xs text-slate-500">TICKET</p>
          <p id="result-ticket" class="text-xl font-bold text-[#00f3ff]"></p>
        </div>
        <span id="result-status-badge" class="px-3 py-1 rounded text-xs font-bold uppercase"></span>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
        <div>
          <p class="text-xs text-slate-500">Equipo</p>
          <p id="result-device" class="text-slate-200"></p>
        </div>
        <div>
          <p class="text-xs text-slate-500">Falla reportada</p>
          <p id="result-issue" class="text-slate-200"></p>
        </div>
      </div>

      <!-- Línea de tiempo -->
      <div class="mb-4">
        <p class="text-xs text-slate-500 mb-2">HISTORIAL</p>
        <ul id="result-history" class="space-y-2 text-sm"></ul>
      </div>

      <!-- Factura -->
      <div id="invoice-section" class="border-t border-[#00f3ff]/20 pt-4">
        <p class="text-xs text-slate-500 mb-2">FACTURA</p>
        <div id="invoice-content" class="text-sm"></div>
      </div>

    </div>
  </div>

<script src="/js/seguimiento.js"></script>
</body>
</html>
